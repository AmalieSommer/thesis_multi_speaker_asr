[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "multi_speaker_asr"
version = "0.0.1"
description = "multi-speaker asr"
authors = [
  { name = "Amalie", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "carbontracker>=2.4.5",
    "ctranslate2>=4.5.0",
    "datacollective>=0.5.1",
    "huggingface-hub<1",
    "librosa>=0.11.0",
    "sentence-transformers",
    "soundfile>=0.13.1",
    "torch>=2.4.0,<3.0.0",
    "torchaudio>=2.4.0,<3.0.0",
    "transformers",
    "faster-whisper",
    "torchmetrics>=1.9.0",
    "ipykernel>=7.2.0",
    "num2words>=0.5.14",
    "pydub>=0.25.1",
    "jiwer>=4.0.0",
    "memory-profiler>=0.61.0",
    "pyannote-audio>=3.4.0",
    "datasets<4.0.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
