[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "multi_speaker_asr"
version = "0.0.1"
description = "multi-speaker asr"
authors = [
  { name = "Amalie", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "carbontracker",
    "ctranslate2",
    "datacollective",
    "huggingface-hub<1",
    "librosa",
    "sentence-transformers",
    "soundfile",
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.7.0,<2.9.0",
    "torchvision>=0.23.0,<0.25.0",
    "transformers",
    "faster-whisper",
    "torchmetrics",
    "num2words",
    "pydub",
    "jiwer",
    "pyannote-audio",
    "datasets",
    "whisperx",
    "optimum-onnx[onnxruntime]>=0.1.0",
    "pyctcdecode>=0.5.0",
    "silero-vad>=6.2.1",
    "optimum-quanto>=0.2.7",
    "accelerate>=1.14.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
