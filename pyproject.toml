[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "multi_speaker_asr"
version = "0.0.1"
description = "multi-speaker asr"
authors = [
  { name = "Amalie", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "datasets>=4.8.4",
    "fastapi==0.115.6",
    "huggingface-hub>=1.7.2",
    "hydra-core>=1.3.2",
    "librosa>=0.11.0",
    "sentence-transformers>=5.4.1",
    "soundfile>=0.13.1",
    "speechbrain>=1.1.0",
    "torch==2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=5.3.0",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "whisperx>=3.4.4",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
